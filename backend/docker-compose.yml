services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: prism-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: prism-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  face-worker:
    build: ../face-worker
    container_name: prism-face-worker
    ports:
      - "8001:8001"
    volumes:
      - face_models:/models
    restart: unless-stopped

  # Not optional: redaction fails closed without it (PiiUnavailableError ->
  # piiStatus=DEFERRED), so a stack missing this one silently stops publishing
  # redacted frames rather than publishing unmasked ones.
  image-pii-worker:
    build: ../ai-core/image-pii-worker
    container_name: prism-image-pii-worker
    ports:
      - "8002:8002"
    restart: unless-stopped
  audio-worker:
    # Opt-in: `docker compose --profile audio up -d`. The image is built from
    # nvidia/cuda and pulls ~270 apt packages plus torch — a multi-GB, ~20min
    # build. Nothing else in the stack needs it, and with AUDIO_CAPTURE_ENABLED
    # unset the backend's recording routes answer 503 without ever calling it,
    # so building it by default costs a long wait for an unreachable service.
    profiles: [audio]
    build: ../ai-core/audio-worker
    container_name: prism-audio-worker
    # Optional so the whole stack still comes up on a machine that has not
    # configured audio. Without `required: false` a missing .env fails every
    # service in the file, not just this one.
    env_file:
      - path: ../ai-core/audio-worker/.env
        required: false
    # Whisper's weights and the gated pyannote checkpoints land in the HF cache
    # on first analyze — roughly a gigabyte, pulled over a slow gated download.
    # Without a volume that cache lives in the container's writable layer and is
    # thrown away by every `up --force-recreate`, so each rebuild pays for it
    # again. Same reasoning as face_models below.
    volumes:
      - audio_models:/root/.cache/huggingface
    ports:
      - "8003:8003"
    restart: unless-stopped

  # Opt-in: `docker compose --profile video up -d`. Same reasoning as
  # audio-worker above — nothing else in the stack needs it, and with no
  # VideoAsset rows the recognition pass never calls it, so a session of photos
  # behaves identically whether this is running or not. Building it by default
  # would add an opencv/insightface image to every `npm run deps`.
  video-worker:
    profiles: [video]
    build: ../ai-core/video-worker
    container_name: prism-video-worker
    environment:
      # Reached over the compose network, not localhost: the PII detector is a
      # fail-closed dependency of /analyze, and pointing this at the host would
      # make every analyze 503 with a connection error that looks like the
      # detector is broken rather than misaddressed.
      PII_SERVICE_URL: http://image-pii-worker:8002
    depends_on:
      - image-pii-worker
    # Shares face-worker's model volume. Both load the identical buffalo_l pack
    # (a correctness requirement, not a convenience — see the worker README), so
    # a second copy would be 300MB of duplicate download for identical bytes.
    volumes:
      - face_models:/models
    ports:
      - "8004:8004"
    restart: unless-stopped

volumes:
  qdrant_storage:
  redis_data:
  face_models:
  audio_models:
