services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: prism-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: prism-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  face-worker:
    build: ../face-worker
    container_name: prism-face-worker
    ports:
      - "8001:8001"
    volumes:
      - face_models:/models
    restart: unless-stopped

  # Not optional: redaction fails closed without it (PiiUnavailableError ->
  # piiStatus=DEFERRED), so a stack missing this one silently stops publishing
  # redacted frames rather than publishing unmasked ones.
  image-pii-worker:
    build: ../ai-core/image-pii-worker
    container_name: prism-image-pii-worker
    ports:
      - "8002:8002"
    restart: unless-stopped
  audio-worker:
    build: ../ai-core/audio-worker
    container_name: prism-audio-worker
    env_file:
      - ../ai-core/audio-worker/.env
    ports:
      - "8003:8003"
    volumes:
      - ../ai-core/audio-worker:/app
      - /app/.venv
    restart: unless-stopped

  text-worker:
    build: ../ai-core/text-services
    container_name: prism-text-worker
    ports:
      - "8004:8004"
    volumes:
      - ../ai-core/text-services:/app
    restart: unless-stopped

volumes:
  qdrant_storage:
  redis_data:
  face_models:
