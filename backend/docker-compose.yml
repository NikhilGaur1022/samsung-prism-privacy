services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: prism-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: prism-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  face-worker:
    build: ../face-worker
    container_name: prism-face-worker
    ports:
      - "8001:8001"
    volumes:
      - face_models:/models
    restart: unless-stopped

  # Not optional: redaction fails closed without it (PiiUnavailableError ->
  # piiStatus=DEFERRED), so a stack missing this one silently stops publishing
  # redacted frames rather than publishing unmasked ones.
  image-pii-worker:
    build: ../ai-core/image-pii-worker
    container_name: prism-image-pii-worker
    ports:
      - "8002:8002"
    restart: unless-stopped
  audio-worker:
    # Opt-in: `docker compose --profile audio up -d`. The image is built from
    # nvidia/cuda and pulls ~270 apt packages plus torch — a multi-GB, ~20min
    # build. Nothing else in the stack needs it, and with AUDIO_CAPTURE_ENABLED
    # unset the backend's recording routes answer 503 without ever calling it,
    # so building it by default costs a long wait for an unreachable service.
    profiles: [audio]
    build: ../ai-core/audio-worker
    container_name: prism-audio-worker
    # Optional so the whole stack still comes up on a machine that has not
    # configured audio. Without `required: false` a missing .env fails every
    # service in the file, not just this one.
    env_file:
      - path: ../ai-core/audio-worker/.env
        required: false
    ports:
      - "8003:8003"
    restart: unless-stopped

volumes:
  qdrant_storage:
  redis_data:
  face_models:
