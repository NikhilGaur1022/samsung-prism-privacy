services:
  # Opt-in local Postgres: `docker compose --profile localdb up -d`.
  #
  # DATABASE_URL normally points at Supabase, which is remote. That is the right
  # default for a deployed environment and the wrong one for a laptop on a slow
  # link: measured from this machine, the round-trip to the pooler is ~550ms
  # (and ~560ms to google.com — the link, not the provider), which made a bare
  # `SELECT 1` cost 2.4 SECONDS. Every page in the portal issues several
  # queries, so the whole application read as broken when nothing was.
  #
  # Against this container the same query is ~1ms. Nothing else changes: it is
  # the same schema, applied by the same `prisma migrate deploy`, so switching
  # is a DATABASE_URL edit and switching back is the same edit reversed.
  #
  # 5434 because 5432 (host Postgres), 5433 (jre-pg) and 54322 (a Supabase local
  # stack) are all already taken on this machine.
  postgres:
    profiles: [localdb]
    # postgres:16, not :16-alpine — this image is already on the machine, and on
    # a link this slow "already on disk" beats "150MB smaller".
    image: postgres:16
    container_name: prism-postgres
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism_local_dev
      POSTGRES_DB: prism
    ports:
      - "5434:5432"
    volumes:
      - prism_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d prism"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: prism-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: prism-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  face-worker:
    build: ../face-worker
    container_name: prism-face-worker
    ports:
      - "8001:8001"
    volumes:
      - face_models:/models
    restart: unless-stopped

  # Not optional: redaction fails closed without it (PiiUnavailableError ->
  # piiStatus=DEFERRED), so a stack missing this one silently stops publishing
  # redacted frames rather than publishing unmasked ones.
  image-pii-worker:
    build: ../ai-core/image-pii-worker
    container_name: prism-image-pii-worker
    ports:
      - "8002:8002"
    restart: unless-stopped
  audio-worker:
    # Opt-in: `docker compose --profile audio up -d`. The image is built from
    # nvidia/cuda and pulls ~270 apt packages plus torch — a multi-GB, ~20min
    # build. Nothing else in the stack needs it, and with AUDIO_CAPTURE_ENABLED
    # unset the backend's recording routes answer 503 without ever calling it,
    # so building it by default costs a long wait for an unreachable service.
    profiles: [audio]
    build: ../ai-core/audio-worker
    container_name: prism-audio-worker
    # Optional so the whole stack still comes up on a machine that has not
    # configured audio. Without `required: false` a missing .env fails every
    # service in the file, not just this one.
    env_file:
      - path: ../ai-core/audio-worker/.env
        required: false
    # Whisper's weights and the gated pyannote checkpoints land in the HF cache
    # on first analyze — roughly a gigabyte, pulled over a slow gated download.
    # Without a volume that cache lives in the container's writable layer and is
    # thrown away by every `up --force-recreate`, so each rebuild pays for it
    # again. Same reasoning as face_models below.
    #
    # These three were two separate `volumes:` blocks until 2026-08-21. YAML
    # keeps the last mapping key and discards the first, so the model cache
    # above was never mounted and every rebuild re-downloaded the weights the
    # comment exists to avoid. Worse, a duplicate key makes the whole file
    # unparseable to current Docker Compose, which fails `docker compose` for
    # every service in it, not just this one.
    volumes:
      - audio_models:/root/.cache/huggingface
      - ../ai-core/audio-worker:/app
      - /app/.venv
    ports:
      - "8003:8003"
    restart: unless-stopped

  text-worker:
    build: ../ai-core/text-services
    container_name: prism-text-worker
    ports:
      - "8004:8004"
    volumes:
      - ../ai-core/text-services:/app
    restart: unless-stopped

  # Opt-in: `docker compose --profile video up -d`. Same reasoning as
  # audio-worker above — nothing else in the stack needs it, and with no
  # VideoAsset rows the recognition pass never calls it, so a session of photos
  # behaves identically whether this is running or not. Building it by default
  # would add an opencv/insightface image to every `npm run deps`.
  video-worker:
    profiles: [video]
    build: ../ai-core/video-worker
    container_name: prism-video-worker
    environment:
      # We hardcode the compose-network address because the backend's .env
      # automatically sets PII_SERVICE_URL=http://localhost:8002 for the host API,
      # which would otherwise be injected here and break the container's networking.
      PII_SERVICE_URL: http://image-pii-worker:8002
    depends_on:
      - image-pii-worker
    # Shares face-worker's model volume. Both load the identical buffalo_l pack
    # (a correctness requirement, not a convenience — see the worker README), so
    # a second copy would be 300MB of duplicate download for identical bytes.
    volumes:
      - face_models:/models
    # 8005, not 8004: text-worker above already owns 8004. Both published on it
    # meant `docker compose --profile video up` failed to bind whichever came
    # second, and the backend's VIDEO_SERVICE_URL default reached the text
    # service instead — a 404 from the wrong worker, which reads like the video
    # worker is broken rather than absent.
    ports:
      - "8005:8005"
    restart: unless-stopped

volumes:
  qdrant_storage:
  redis_data:
  face_models:
  audio_models:
  prism_pgdata:
